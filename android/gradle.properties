# JVM heap size for Gradle daemon to avoid OutOfMemory errors
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1g

# Enable parallel execution for faster builds
org.gradle.parallel=true
org.gradle.configureondemand=true

# AndroidX support
android.useAndroidX=true
android.enableJetifier=true

# Enable AAPT2 PNG crunching in release builds
android.enablePngCrunchInReleaseBuilds=true

# Specify which architectures to build for
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# Enable Hermes JS engine for performance
hermesEnabled=true

# Enable GIF support (~200 B increase)
expo.gif.enabled=true

# Enable WebP support (~85 KB increase)
expo.webp.enabled=true
# Disable animated WebP (optional, iOS doesn't support it)
expo.webp.animated=false

# Enable network inspector for dev builds
EX_DEV_CLIENT_NETWORK_INSPECTOR=true

# Use legacy packaging (false = modern packaging)
expo.useLegacyPackaging=false

# Enable edge-to-edge mode for Android
expo.edgeToEdgeEnabled=true

# Optional: Limit Gradle workers to avoid memory issues on low-RAM machines
# org.gradle.workers.max=2
# Enable new architecture for React Native (required by Reanimated)
newArchEnabled=true
